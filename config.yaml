baseURL: "https://birlug.github.io/"
# Rebase root-relative HTML links without rewriting historical Markdown.
canonifyURLs: true
locale: fa-IR
defaultContentLanguage: fa
title: "لاگ بیرجند"
timeZone: Asia/Tehran
pagination:
  pagerSize: 12
params:
  subtitle: "گروه کاربران گنو/لینوکس بیرجند"
  # Empty => local media mount. Set HUGO_PARAMS_MEDIABASEURL after media deployment.
  mediaBaseURL: ""
  analytics: true
  menu:
    items:
      - {title: "جلسات", url: "/", name: "events", icon: "calendar-days"}
      - {title: "گالری", url: "/images/", name: "images", icon: "images"}
      - {title: "چالش‌ها", url: "/~challenge/", name: "~challenge", icon: "puzzle"}
      - {title: "بلاگ", url: "/~blog/", name: "~blog", icon: "notebook-pen"}
      - {title: "موضوعات", url: "/topics/", name: "topics", icon: "tags"}
      - {title: "ارائه‌دهندگان", url: "/speakers/", name: "speakers", icon: "users"}
      - {title: "حمایت مالی", url: "/donation/", name: "donation", icon: "heart-handshake"}
  footer:
    items:
      - {title: "گیت‌هاب", url: "https://github.com/birlug"}
      - {title: "تلگرام", url: "https://t.me/birlug"}
      - {title: "اینستاگرام", url: "https://instagram.com/birjandlug"}
      - {title: "ایوند", url: "https://evand.com/organizations/birlug"}
taxonomies:
  topics: topics
  speakers: speakers
  locations: locations
outputs:
  home: [HTML, RSS, Search]
  page: [HTML]
outputFormats:
  Search:
    mediaType: application/json
    baseName: search-index
    isPlainText: true
module:
  mounts:
    - source: static
      target: static
    - source: ../birlug-media/public/media
      target: static/media
markup:
  highlight:
    noClasses: false
    style: bw
