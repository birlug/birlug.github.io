name: Deploy BirLUG

on:
  push:
    branches: [master]
    paths-ignore: [README.md, DESIGN.md, SYSTEM-DESIGN.md]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: site
    env:
      HUGO_VERSION: 0.167.0
      HUGO_PARAMS_MEDIABASEURL: ${{ vars.MEDIA_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: site
      - name: Read Pages URL
        id: pages
        uses: actions/configure-pages@v6
      - name: Checkout media
        uses: actions/checkout@v7
        with:
          repository: birlug/media
          ref: main
          path: birlug-media
          token: ${{ secrets.MEDIA_READ_TOKEN || github.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install tools
        run: |
          python -m pip install -r tools/requirements.txt
          npm ci --ignore-scripts
          npm run icons
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --location --retry 3 "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}" -o "/tmp/${archive}"
          curl --fail --location --retry 3 "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt" -o /tmp/hugo-checksums.txt
          (cd /tmp && grep " ${archive}$" hugo-checksums.txt | sha256sum --check -)
          tar -xzf "/tmp/${archive}" -C /tmp hugo
      - name: Validate and build
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          test -d ../birlug-media/public/media
          cp ../birlug-media/public/catalog.json data/media.json
          python tools/content.py
          /tmp/hugo --baseURL "${PAGES_BASE_URL%/}/" --gc --minify --panicOnWarning --cleanDestinationDir
          python tools/check_site.py public --base-url "${PAGES_BASE_URL%/}/"
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site/public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
