name: Broadcast
on:
  workflow_dispatch:
    inputs:
      event:
        description: "Event directory slug, e.g. 45 or sfd-1404"
        type: string
        required: true
      environment:
        description: "Destination"
        type: choice
        options: [test, production]
        default: test
        required: true
permissions:
  contents: read
jobs:
  broadcast:
    runs-on: ubuntu-latest
    environment: broadcast
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r tools/requirements.txt
      - name: Notify
        env:
          EVENT: ${{ inputs.event }}
          TEST: ${{ inputs.environment == 'test' && '1' || '0' }}
          CHAT_ID: ${{ inputs.environment == 'test' && vars.TEST_CHAT_ID || vars.CHAT_ID }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          MASTODON_URL: ${{ vars.MASTODON_URL }}
        run: bash tools/notify.sh
